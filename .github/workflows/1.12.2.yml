name: 1.12.2 Build

on:
  pull_request:
  push:
    branches:
      - "mainline"

env:
  MINECRAFT_VERSION: "1.12.2"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # read only on pull requests, otherwise allow writes
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Get WorldMap Version
        run: echo "WORLDMAP_VERSION=$(./gradlew -q printWorldMapVersion)" >> $GITHUB_ENV

      - name: Get Minimap Version
        run: echo "MINIMAP_VERSION=$(./gradlew -q printMinimapVersion)" >> $GITHUB_ENV

      - name: Get XaeroLib Version
        run: echo "XAEROLIB_VERSION=$(./gradlew -q printXaeroLibVersion)" >> $GITHUB_ENV

      - name: Get Forge Jar Filename
        run: echo "XP_FORGE=XaeroPlus-DEV-${{ github.run_number }}+forge-${{ env.MINECRAFT_VERSION }}-WM${{ env.WORLDMAP_VERSION }}-MM${{ env.MINIMAP_VERSION }}" >> $GITHUB_ENV

      - name: Rename built mod
        run: mv build/libs/XaeroPlus-*.jar ${{ env.XP_FORGE }}.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.XP_FORGE }}
          path: ${{ env.XP_FORGE }}.jar
    outputs:
      xp_forge: ${{ env.XP_FORGE }}
      worldmap_version: ${{ env.WORLDMAP_VERSION }}
      minimap_version: ${{ env.MINIMAP_VERSION }}
      xaerolib_version: ${{ env.XAEROLIB_VERSION }}

  test-forge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download job artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: artifacts/

      - name: Set CI Test Env Var
        run: echo "XP_CI_TEST=true" >> $GITHUB_ENV

      - name: Setup Forge Test
        run: |
          mkdir -p run/mods && cp artifacts/${{ needs.build.outputs.xp_forge }}.jar run/mods \
          && wget https://api.modrinth.com/maven/maven/modrinth/xaeros-minimap/forge-1.12.2-${{ needs.build.outputs.minimap_version }}/xaeros-minimap-forge-1.12.2-${{ needs.build.outputs.minimap_version }}.jar -P run/mods/ \
          && wget https://api.modrinth.com/maven/maven/modrinth/xaeros-world-map/forge-1.12.2-${{ needs.build.outputs.worldmap_version }}/xaeros-world-map-forge-1.12.2-${{ needs.build.outputs.worldmap_version }}.jar -P run/mods/ \
          && wget https://api.modrinth.com/maven/maven/modrinth/mixinbooter/9.4/!mixinbooter-9.4.jar -P run/mods/ \
          && wget https://api.modrinth.com/maven/maven/modrinth/xaerolib/forge-1.12.2-${{ needs.build.outputs.xaerolib_version }}/xaerolib-forge-1.12.2-${{ needs.build.outputs.xaerolib_version }}.jar -P run/mods/

      - name: Forge Test
        uses: headlesshq/mc-runtime-test@4.4.0
        with:
          mc: ${{ env.MINECRAFT_VERSION }}
          modloader: forge
          regex: .*forge.*
          mc-runtime-test: lexforge
          java: 8
          xvfb: false
          headlessmc-command: -lwjgl --jvm -Djava.awt.headless=true
          cache-mc: true
