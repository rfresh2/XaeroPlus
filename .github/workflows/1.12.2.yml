name: 1.12.2 Build

on:
  pull_request:
  push:
    branches:
      - "mainline"

env:
  WORLDMAP_VERSION: "1.40.5"
  MINIMAP_VERSION: "25.3.5"
  XAEROLIB_VERSION: "1.0.44"
  MINECRAFT_VERSION: "1.12.2"
  MINECRAFT_VERSION_SHORT: "1.12"
  MOD_LOADER: "Forge"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # read only on pull requests, otherwise allow writes
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Get Forge Jar Filename
        run: echo "XP_FORGE=XaeroPlus-${{ github.run_number }}+forge-${{ env.MINECRAFT_VERSION }}-WM${{ env.WORLDMAP_VERSION }}-MM${{ env.MINIMAP_VERSION }}" >> $GITHUB_ENV

      - name: Rename built mod
        run: mv build/libs/xaeroplus-${{ env.MINECRAFT_VERSION }}.jar ${{ env.XP_FORGE }}.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.XP_FORGE }}
          path: ${{ env.XP_FORGE }}.jar
    outputs:
      xp_forge: ${{ env.XP_FORGE }}

  test-forge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download job artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: artifacts/

      - name: Set CI Test Env Var
        run: echo "XP_CI_TEST=true" >> $GITHUB_ENV

      - name: Setup Forge Test
        run: |
          mkdir -p run/mods && cp artifacts/${{ needs.build.outputs.xp_forge }}.jar run/mods \
          && wget https://api.modrinth.com/maven/maven/modrinth/xaeros-minimap/forge-1.12.2-${{ env.MINIMAP_VERSION }}/xaeros-minimap-forge-1.12.2-${{ env.MINIMAP_VERSION }}.jar -P run/mods/ \
          && wget https://api.modrinth.com/maven/maven/modrinth/xaeros-world-map/forge-1.12.2-${{ env.WORLDMAP_VERSION }}/xaeros-world-map-forge-1.12.2-${{ env.WORLDMAP_VERSION }}.jar -P run/mods/ \
          && wget https://api.modrinth.com/maven/maven/modrinth/mixinbooter/9.4/!mixinbooter-9.4.jar -P run/mods/ \
          && wget https://api.modrinth.com/maven/maven/modrinth/xaerolib/forge-1.12-${{ env.XAEROLIB_VERSION }}/xaerolib-forge-1.12-${{ env.XAEROLIB_VERSION }}.jar -P run/mods/

      - name: Forge Test
        uses: headlesshq/mc-runtime-test@4.1.0
        with:
          mc: ${{ env.MINECRAFT_VERSION }}
          modloader: forge
          regex: .*forge.*
          mc-runtime-test: lexforge
          java: 8
          xvfb: false
          headlessmc-command: -lwjgl --jvm -Djava.awt.headless=true
          cache-mc: true
